<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>자바스크립트로 투두리스트만들기</title>
        <link rel="stylesheet" href="reset.css" />
        <link rel="stylesheet" href="todo.css" />
        <script src="todo.js"></script>
    </head>
    <body>
        <main>
            <section class="todo-section">
                <h1>To-Do List</h1>
                <form class="todo-form">
                    <input class="todo-input" type="text" placeholder="할 일을 입력하세요" />
                    <button class="todo-add-button" type="submit">추가</button>
                </form>
                <ul class="todo-list">
                    <!-- JavaScript가 할 일 목록을 여기에 그립니다 -->
                </ul>
            </section>
        </main>
    </body>
</html>
